aid: outverse
name: Outverse
description: >-
  Outverse is an enterprise "service AI operating system" from Outverse Limited, a UK company
  backed by Seedcamp and Wing Venture Capital. Its platform lets support and operations teams deploy
  governed AI agents across complex customer-service workflows — email, chat, voice, and API-driven
  actions — from a single control center. Teams define logic, policies, and human handoffs in natural
  language SOPs rather than rigid workflow builders, and get observability over every agent decision,
  tool call, workflow path, and escalation. Outverse integrates with existing CCaaS and CRM stacks
  (Salesforce, Freshdesk, Genesys, Twilio, Talkdesk) and offers voice agents that verify identity,
  retrieve data, apply policy, and resolve calls end to end. The company advertises SOC 2 and ISO 27001
  certification and does not expose a public developer API at this time. Added to the API Evangelist
  network as a portfolio company of Seedcamp and Wing Venture Capital.
